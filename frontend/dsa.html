
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Career Tracker</h2>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="applications.html">Applications</a>
            <a href="dsa.html">DSA</a>
        </div>
    </nav>

    <main class="container">
        <h1>DSA Tracker</h1>
        <p>Track your Data Structures and Algorithms preparation.</p>

        <section class="form-container">
            <h2>Add DSA Topic</h2>

            <form id="dsaForm">
                <label for="topic">Topic</label>
                <input type="text" id="topic"
                       placeholder="e.g. Arrays" required>

                <label for="status">Status</label>
                <select id="status" required>
                    <option value="Not Started">Not Started</option>
                    <option value="Learning">Learning</option>
                    <option value="Completed">Completed</option>
                </select>

                <label for="progress">Progress (%)</label>
                <input type="number" id="progress"
                       min="0" max="100" value="0" required>

                <button type="submit">Add Topic</button>
                <p id="dsaMessage"></p>
            </form>
        </section>

        <section class="dsa-section">
            <h2>Your DSA Topics</h2>
            <div id="dsaList">Loading topics...</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
